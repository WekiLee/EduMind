name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy
      - run: cd backend && ruff check .
      - run: cd backend && mypy app --ignore-missing-imports --follow-imports=silent --implicit-optional --disable-error-code var-annotated --disable-error-code union-attr --disable-error-code return-value --disable-error-code arg-type --disable-error-code index --disable-error-code assignment --disable-error-code misc

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: edumind_test
          POSTGRES_USER: edumind
          POSTGRES_PASSWORD: edumind_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: pip install pytest pytest-asyncio pytest-cov httpx fakeredis
      - run: cd backend && python -m pytest tests/ -v --cov=app
        env:
          DATABASE_URL: postgresql+asyncpg://edumind:edumind_dev@localhost:5432/edumind_test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm install
      - run: cd frontend && npm run build
